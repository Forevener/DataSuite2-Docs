<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{TITLE}} — DataSuite 2</title>
	<meta name="description" content="{{DESCRIPTION}}">
	<meta property="og:title" content="{{TITLE}} — DataSuite 2">
	<meta property="og:description" content="{{DESCRIPTION}}">
	<meta property="og:type" content="article">
	<meta property="og:url" content="{{CANONICAL_URL}}">
	<meta property="og:site_name" content="DataSuite 2">
	{{HREFLANG}}
	<link rel="canonical" href="{{CANONICAL_URL}}">
	<script>
		var t = localStorage.getItem("docs-theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
		document.documentElement.setAttribute("data-theme", t);
	</script>
	<link rel="stylesheet" href="../../assets/docs.css">
	<link rel="stylesheet" href="../pagefind/pagefind-ui.css">
</head>
<body>
	<header class="site-header">
		<div class="header-left">
			<button type="button" class="sidebar-toggle" data-action="toggle-sidebar" aria-label="{{UI_ARIA_TOGGLE_NAV}}">
				<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
					<line x1="3" y1="5" x2="17" y2="5"/>
					<line x1="3" y1="10" x2="17" y2="10"/>
					<line x1="3" y1="15" x2="17" y2="15"/>
				</svg>
			</button>
			<a href="{{APP_URL}}/" class="site-title">DataSuite 2</a>
			<span class="site-subtitle">{{UI_DOCUMENTATION}}</span>
		</div>
		<div class="header-right">
			<div class="search-container" data-element="search"></div>
			<button type="button" class="search-toggle" data-action="toggle-search" aria-label="{{UI_ARIA_SEARCH}}">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
				</svg>
			</button>
			<div class="lang-switcher" data-element="lang-switcher">
				{{LANG_SWITCHER}}
			</div>
			<button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="{{UI_ARIA_TOGGLE_THEME}}">
				<svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="12" cy="12" r="5"/>
					<line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
					<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
					<line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
					<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
				</svg>
				<svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
				</svg>
			</button>
		</div>
	</header>
	<div class="layout">
		<aside class="sidebar" data-element="sidebar">
			<div class="nav-filter">
				<input type="text" placeholder="{{UI_FILTER_PAGES}}" data-action="filter-nav" aria-label="{{UI_ARIA_FILTER_NAV}}">
			</div>
			<nav data-element="nav">
				{{NAV}}
			</nav>
		</aside>
		<div class="sidebar-backdrop" data-action="close-sidebar"></div>
		<div class="content-area">
			<main class="content" data-pagefind-body>
				<details class="toc-mobile" data-element="toc-mobile">
					<summary>{{UI_ON_THIS_PAGE}}</summary>
					{{TOC}}
				</details>
				{{CONTENT}}
			</main>
			<aside class="toc" data-element="toc">
				<div class="toc-inner">
					<div class="toc-title">{{UI_ON_THIS_PAGE}}</div>
					{{TOC}}
				</div>
			</aside>
		</div>
	</div>
	<button type="button" class="back-to-top" data-action="back-to-top" aria-label="{{UI_ARIA_BACK_TO_TOP}}">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<polyline points="18 15 12 9 6 15"/>
		</svg>
	</button>
	<div class="search-overlay" data-element="search-overlay"></div>
	<script src="../pagefind/pagefind-ui.js" type="text/javascript"></script>
	<script src="../../assets/docs.js"></script>
</body>
</html>
